services:

  # ── Baza danych ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: praktyki_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-praktyki_db}
      POSTGRES_USER:     ${POSTGRES_USER:-praktyki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haslo}
    volumes:
      - praktyki_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-praktyki} -d ${POSTGRES_DB:-praktyki_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  # ── PgBouncer — connection pooling przed Postgresem ─────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: praktyki_pgbouncer
    restart: unless-stopped
    environment:
      # Używane przez entrypoint jako fallback, jeśli nie zamontujemy own configu.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-praktyki}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-haslo}
      DB_NAME: ${POSTGRES_DB:-praktyki_db}
      AUTH_TYPE: md5
      POOL_MODE: session
      MAX_CLIENT_CONN: "2000"
      DEFAULT_POOL_SIZE: "30"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-praktyki}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

# ── Redis — broker Celery + backend wyników ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: praktyki_redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - praktyki_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  # ── Flask + Gunicorn ─────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ZProjekt/.env
    environment:
      DATABASE_URL:           postgresql+psycopg2://${POSTGRES_USER:-praktyki}:${POSTGRES_PASSWORD:-haslo}@pgbouncer:5432/${POSTGRES_DB:-praktyki_db}
      REDIS_URL:              redis://redis:6379/0
      CELERY_BROKER_URL:      redis://redis:6379/0
      CELERY_RESULT_BACKEND:  redis://redis:6379/1
      SQLALCHEMY_POOL_SIZE:   "5"
      SQLALCHEMY_MAX_OVERFLOW: "5"
      WEB_WORKERS:            "4"
      CORS_ORIGINS:           ${CORS_ORIGINS:-*}
    volumes:
      - praktyki_uploads:/app/uploads
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - backend
      - frontend

  # ── Celery worker — generowanie PDF w tle ────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      celery -A celery_worker.celery worker
      --loglevel=info
      --concurrency=4
      --queues=celery
    restart: unless-stopped
    env_file: ZProjekt/.env
    environment:
      DATABASE_URL:           postgresql+psycopg2://${POSTGRES_USER:-praktyki}:${POSTGRES_PASSWORD:-haslo}@pgbouncer:5432/${POSTGRES_DB:-praktyki_db}
      REDIS_URL:              redis://redis:6379/0
      CELERY_BROKER_URL:      redis://redis:6379/0
      CELERY_RESULT_BACKEND:  redis://redis:6379/1
    volumes:
      - praktyki_uploads:/app/uploads
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_worker.celery inspect ping -d celery@$$HOSTNAME >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend

  # ── Nginx — reverse proxy + pliki statyczne ──────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: praktyki_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ZProjekt/static:/app/static:ro
      - praktyki_uploads:/app/uploads:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - frontend

volumes:
  praktyki_pgdata:
  praktyki_redis_data:
  praktyki_uploads:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
